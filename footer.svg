<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96" role="img" aria-label="Terminal: ping smallghost42, reply from Antananarivo, available." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Terminal: ping smallghost42, reply from Antananarivo, available.</title>
<style>
.b{fill:none;stroke:#30363d;stroke-width:1}
.l{fill:none;stroke:#30363d;stroke-width:1}
.ac{stroke:#58a6ff}
.acf{fill:#58a6ff}
.fg{fill:#e6edf3}
.mu{fill:#7d8590}
.ok{fill:#3fb950}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes hop{0%{stroke-dashoffset:10}13%{stroke-dashoffset:-40}100%{stroke-dashoffset:-40}}
.pk{fill:none;stroke-width:2;stroke-dasharray:10 100;stroke-dashoffset:10;animation:hop 6s linear infinite backwards}
@keyframes bl{50%{opacity:0}}
.cur{animation:bl 1.2s steps(1) infinite}
@media (prefers-color-scheme:light){.b,.l{stroke:#d0d7de}.ac{stroke:#0969da}.acf{fill:#0969da}.fg{fill:#1f2328}.mu{fill:#656d76}.ok{fill:#1a7f37}}
@media (prefers-reduced-motion:reduce){.pk,.cur{animation:none}}
</style>
<rect class="b" x=".5" y=".5" width="839" height="95" rx="6"/>
<text class="mono mu" x="32" y="34">$ <tspan class="fg">ping smallghost42</tspan></text>
<text class="mono mu" x="32" y="56">reply from antananarivo, mg: <tspan class="ok">available</tspan></text>
<text class="mono mu" x="32" y="78">$</text><rect class="cur fg" x="47" y="67" width="7" height="13"/>
</svg>
