<svg xmlns="http://www.w3.org/2000/svg" width="840" height="176" viewBox="0 0 840 176" role="img" aria-label="Fenohery, DevSecOps. Pipeline from source to cluster: source, build, test, scan, deploy, cluster." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fenohery, DevSecOps. Pipeline from source to cluster: source, build, test, scan, deploy, cluster.</title>
<style>
.b{fill:none;stroke:#3d444d;stroke-width:1}
.l{fill:none;stroke:#3d444d;stroke-width:1}
.ac{stroke:#58a6ff}
.acf{fill:#58a6ff}
.fg{fill:#f0f6fc}
.mu{fill:#9198a1}
.ok{fill:#3fb950}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;font-size:12px}
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
@keyframes hop{0%{stroke-dashoffset:10}13%{stroke-dashoffset:-40}100%{stroke-dashoffset:-40}}
.pk{fill:none;stroke-width:2;stroke-dasharray:10 100;stroke-dashoffset:10;animation:hop 6s linear infinite backwards}
@media (prefers-color-scheme:light){.b,.l{stroke:#d1d9e0}.ac{stroke:#0969da}.acf{fill:#0969da}.fg{fill:#1f2328}.mu{fill:#59636e}.ok{fill:#1a7f37}}
@media (prefers-reduced-motion:reduce){.pk{animation:none}}
</style>
<rect class="b" x=".5" y=".5" width="839" height="175" rx="6"/>
<text class="sans fg" x="32" y="68" font-size="28" font-weight="600">Fenohery</text>
<text class="mono mu" x="32" y="92" font-size="13">DevSecOps. Cloud, networks, infrastructure as code.</text>
<rect class="b" x="716.5" y="44.5" width="92" height="24" rx="12"/><circle class="ok" cx="732" cy="56.5" r="3"/><text class="mono mu" x="743" y="60.5">available</text>
<line class="l" x1="128.0" y1="131.0" x2="168.0" y2="131.0"/><line class="pk ac" x1="128.0" y1="131.0" x2="168.0" y2="131.0" style="animation-delay:0.0s"/>
<line class="l" x1="264.0" y1="131.0" x2="304.0" y2="131.0"/><line class="pk ac" x1="264.0" y1="131.0" x2="304.0" y2="131.0" style="animation-delay:0.8s"/>
<line class="l" x1="400.0" y1="131.0" x2="440.0" y2="131.0"/><line class="pk ac" x1="400.0" y1="131.0" x2="440.0" y2="131.0" style="animation-delay:1.6s"/>
<line class="l" x1="536.0" y1="131.0" x2="576.0" y2="131.0"/><line class="pk ac" x1="536.0" y1="131.0" x2="576.0" y2="131.0" style="animation-delay:2.4s"/>
<line class="l" x1="672.0" y1="131.0" x2="712.0" y2="131.0"/><line class="pk ac" x1="672.0" y1="131.0" x2="712.0" y2="131.0" style="animation-delay:3.2s"/>
<rect class="b" x="32.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="80.5" y="135.0" text-anchor="middle">source</text>
<rect class="b" x="168.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="216.5" y="135.0" text-anchor="middle">build</text>
<rect class="b" x="304.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="352.5" y="135.0" text-anchor="middle">test</text>
<rect class="b" x="440.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="488.5" y="135.0" text-anchor="middle">scan</text>
<rect class="b" x="576.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="624.5" y="135.0" text-anchor="middle">deploy</text>
<rect class="b ac" x="712.5" y="116.5" width="96" height="30" rx="3"/><text class="mono fg" x="760.5" y="135.0" text-anchor="middle">cluster</text>
</svg>
