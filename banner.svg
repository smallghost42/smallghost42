<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#58a6ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="800" height="120" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle top accent line -->
  <rect x="35" y="28" width="40" height="2" rx="1" fill="url(#accent)"/>

  <!-- Name -->
  <text x="35" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#accent)" letter-spacing="-0.5">Fenohery</text>

  <!-- Tags -->
  <text x="150" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#8b949e">CS · DevOps · MLOps · Cloud</text>

  <!-- Terminal line -->
  <text x="35" y="76" font-family="'Courier New', monospace" font-size="11" fill="#7ee787">▸</text>
  <text x="50" y="76" font-family="'Courier New', monospace" font-size="11" fill="#8b949e">infrastructure as code — deploying</text>

  <!-- Blinking cursor -->
  <rect x="432" y="66" width="7" height="12" rx="1" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Status pill — right side -->
  <g transform="translate(660, 38)">
    <rect width="105" height="22" rx="11" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="11" r="3" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7ee787" letter-spacing="0.5">AVAILABLE</text>
  </g>

  <!-- Bottom pipeline — minimal dots connected by a thin line -->
  <line x1="35" y1="98" x2="765" y2="98" stroke="#21262d" stroke-width="1"/>

  <circle cx="35"  cy="98" r="3" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="278" cy="98" r="3" fill="#3fb950"/>
  <circle cx="522" cy="98" r="3" fill="#bc8cff"/>
  <circle cx="765" cy="98" r="3" fill="#58a6ff" filter="url(#glow)"/>

  <text x="35"  y="112" font-family="system-ui, sans-serif" font-size="8" fill="#484f58" text-anchor="middle">source</text>
  <text x="278" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#484f58" text-anchor="middle">build</text>
  <text x="522" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#484f58" text-anchor="middle">deploy</text>
  <text x="765" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#484f58" text-anchor="middle">cloud</text>
</svg>
