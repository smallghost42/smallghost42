<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58a6ff" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3fb950" flood-opacity="0.8"/>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#bc8cff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="200" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Cyberpunk Grid Background -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <rect width="800" height="200" rx="12" fill="url(#grid)"/>

  <!-- Top Right Status Badge -->
  <g transform="translate(620, 22)">
    <rect width="145" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#3fb950" filter="url(#glow-green)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#7ee787" letter-spacing="1">PIPELINE PASSING</text>
  </g>

  <!-- Terminal Header -->
  <text x="35" y="42" font-family="'Courier New', monospace" font-size="13" fill="#7ee787">
    smallghost@42<tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~/infrastructure</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#c9d1d9">./deploy.sh</tspan>
    <animate attributeName="opacity" values="1;1;0;1" dur="1s" repeatCount="indefinite" begin="0.5s"/>
  </text>
  
  <text x="35" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">Fenohery</text>
  <text x="37" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#8b949e">Computer Science  |  DevOps  |  MLOps  |  Cloud</text>

  <!-- Pipeline Track -->
  <line x1="100" y1="155" x2="700" y2="155" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>

  <!-- Animated Data Packets Flowing -->
  <circle r="3.5" fill="#58a6ff" filter="url(#glow-blue)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 100 155 L 300 155"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  
  <circle r="3.5" fill="#3fb950" filter="url(#glow-green)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 300 155 L 500 155"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <circle r="3.5" fill="#bc8cff" filter="url(#glow-purple)">
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M 500 155 L 700 155"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1: Source -->
  <g transform="translate(100, 155)">
    <circle r="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5" filter="url(#glow-blue)"/>
    <circle r="3" fill="#58a6ff"/>
    <text y="28" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Source</text>
  </g>

  <!-- Node 2: Build -->
  <g transform="translate(300, 155)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="2.5" filter="url(#glow-green)"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#3fb950"/>
    <text y="28" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Build</text>
  </g>

  <!-- Node 3: Deploy -->
  <g transform="translate(500, 155)">
    <polygon points="0,-13 11,-6 11,6 0,13 -11,6 -11,-6" fill="#0d1117" stroke="#bc8cff" stroke-width="2.5" filter="url(#glow-purple)"/>
    <circle r="2.5" fill="#bc8cff"/>
    <text y="28" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Deploy</text>
  </g>

  <!-- Node 4: Cloud -->
  <g transform="translate(700, 155)">
    <path d="M -10 2 C -10 -3 -5 -6 0 -3 C 2 -7 8 -7 10 -3 C 14 -5 17 -1 15 3 Z" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5" filter="url(#glow-blue)"/>
    <text y="28" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Cloud</text>
  </g>
</svg>
