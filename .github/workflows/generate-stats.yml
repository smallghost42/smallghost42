name: Update README Stats

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euxo pipefail {0}

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout stats source repo
        uses: actions/checkout@v4
        with:
          repository: smallghost42/github-stats
          path: github-stats-src
          # If private, use ACCESS_TOKEN with repo read perms:
          # token: ${{ secrets.ACCESS_TOKEN }}

      # Adjust patterns/paths to match your actual files in smallghost42/github-stats
      - name: Copy generated images
        run: |
          mkdir -p assets
          # Example: copy common image types from repo root or subdirs
          find github-stats-src -type f \( -name "*.svg" -o -name "*.png" -o -name "*.jpg" \) -print
          cp -f github-stats-src/*.svg assets/ 2>/dev/null || true
          cp -f github-stats-src/*.png assets/ 2>/dev/null || true
          cp -f github-stats-src/output/*.svg assets/ 2>/dev/null || true
          cp -f github-stats-src/output/*.png assets/ 2>/dev/null || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update stats images from smallghost42/github-stats"
          git push
